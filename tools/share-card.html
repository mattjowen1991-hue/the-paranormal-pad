<!DOCTYPE html>
<!-- Source for images/share.jpg (the preview card shown when the site is shared on WhatsApp, Facebook, etc.).
     To regenerate: open this file at 1200×630 and take a screenshot (see README → Share preview). -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: #efe8dc;
    background-image: radial-gradient(#dfd6c5 1.4px, transparent 1.4px);
    background-size: 28px 28px;
    border-top: 14px solid #3b342e;
    font-family: 'Courier Prime', monospace; color: #1a1918;
    display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 56px; padding: 0 70px 14px;
  }
  .kicker { font-size: 17px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #5c5346; }
  h1 { font-family: 'Special Elite', monospace; font-weight: 400; font-size: 84px; line-height: .98; text-transform: uppercase; margin: 18px 0 22px; }
  .tag { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 27px; color: #4d463d; line-height: 1.4; }
  .stamps { display: flex; gap: 22px; margin-top: 34px; align-items: center; }
  .stamp { font-family: 'Special Elite', monospace; font-size: 22px; letter-spacing: .16em; text-transform: uppercase;
    border: 3px solid currentColor; box-shadow: 0 0 0 1.5px currentColor inset; padding: 9px 16px; color: #8b1e19; transform: rotate(-2.5deg); }
  .stamp.sepia { color: #5c4434; transform: rotate(1.8deg); }
  .photo { position: relative; background: #fbf8f1; border: 1px solid #cfc4b2; padding: 16px 16px 44px;
    box-shadow: 8px 10px 0 rgba(43,39,35,.22); transform: rotate(3deg); }
  .photo img { display: block; width: 100%; height: 400px; object-fit: cover; filter: sepia(55%) contrast(115%) brightness(92%); }
  .photo figcaption { position: absolute; left: 16px; right: 16px; bottom: 12px; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #5c5346; display: flex; justify-content: space-between; }
  .clip { position: absolute; top: -34px; left: 70px; width: 26px; height: 80px; border: 4px solid #6d665e; border-radius: 16px; transform: rotate(-4deg); }
  .clip::after { content: ''; position: absolute; top: 12px; left: 4px; width: 10px; height: 56px; border: 4px solid #948c82; border-radius: 10px; }
</style>
</head>
<body>
  <div>
    <div class="kicker">Record of unexplained occurrences</div>
    <h1>The Paranormal Pad</h1>
    <p class="tag">First-hand accounts of the unexplained — Incident Reports &amp; Incident Tapes.</p>
    <div class="stamps"><span class="stamp">Case files open</span><span class="stamp sepia">Est. 2025</span></div>
  </div>
  <figure class="photo">
    <div class="clip"></div>
    <img src="../images/reports/008/cover.jpg" alt="">
    <figcaption><span>Exhibit A</span><span>Report 008</span></figcaption>
  </figure>
</body>
</html>
